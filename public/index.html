<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUMP RADAR</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23030008'/%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%2300ff88' stroke-width='1.5' opacity='0.5'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%2300ff88' stroke-width='1' opacity='0.3'/%3E%3Cline x1='6' y1='32' x2='58' y2='32' stroke='%2300ff88' stroke-width='0.8' opacity='0.2'/%3E%3Cline x1='32' y1='6' x2='32' y2='58' stroke='%2300ff88' stroke-width='0.8' opacity='0.2'/%3E%3Cline x1='32' y1='32' x2='50' y2='16' stroke='%2300ff88' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%2300ff88'/%3E%3Ccircle cx='50' cy='16' r='3.5' fill='%2300ff88'/%3E%3Ccircle cx='50' cy='16' r='7' fill='none' stroke='%2300ff88' stroke-width='1.5' opacity='0.6'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#02000a;
  --bg2:#060014;
  --card:#0b0020;
  --card2:#110030;
  --card-hover:#160038;
  --green:#00ff88;
  --green-dim:rgba(0,255,136,0.06);
  --green-mid:rgba(0,255,136,0.15);
  --green-glow:rgba(0,255,136,0.3);
  --orange:#ff8c00;
  --red:#ff3b3b;
  --cyan:#00e5ff;
  --yellow:#ffe66d;
  --pink:#ff2d78;
  --text:#d4fce8;
  --text2:#8a9daa;
  --text3:#4a5a68;
  --border:rgba(0,255,136,0.1);
  --border2:rgba(0,255,136,0.22);
}

html{scroll-behavior:smooth}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Syne',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* BACKGROUND */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(0,255,136,0.04) 0%, transparent 70%),
    radial-gradient(ellipse 40% 30% at 80% 50%, rgba(0,229,255,0.025) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}

body::after{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,255,136,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.025) 1px, transparent 1px);
  background-size:60px 60px;
  pointer-events:none;z-index:0;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, black 20%, transparent 80%);
}

/* SCANLINE OVERLAY */
.scanlines{
  position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
}

/* HEADER */
header{
  position:sticky;top:0;z-index:100;
  background:rgba(2,0,10,0.85);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
  padding:0 2rem;
  height:62px;
  display:flex;align-items:center;justify-content:space-between;
}

header::after{
  content:'';
  position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--green-mid),transparent);
}

.logo{display:flex;align-items:center;gap:0.85rem;text-decoration:none;}
.logo svg{display:block;flex-shrink:0;}
.logo-text{
  font-family:'Bebas Neue',cursive;
  font-size:1.65rem;
  letter-spacing:5px;
  color:var(--green);
  text-shadow:0 0 30px rgba(0,255,136,0.5),0 0 60px rgba(0,255,136,0.2);
}
.logo-sub{
  font-family:'JetBrains Mono',monospace;
  font-size:0.55rem;
  letter-spacing:3px;
  color:var(--text3);
  text-transform:uppercase;
  margin-top:1px;
}

.header-right{display:flex;align-items:center;gap:1.25rem;}

.live-pill{
  display:flex;align-items:center;gap:0.5rem;
  background:rgba(0,255,136,0.05);
  border:1px solid var(--border);
  padding:0.3rem 0.75rem;
  border-radius:2px;
}
.live-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 8px var(--green)}50%{opacity:0.3;box-shadow:none}}
.live-txt{
  font-family:'JetBrains Mono',monospace;
  font-size:0.65rem;letter-spacing:3px;color:var(--text3);
  text-transform:uppercase;
}

.check-btn{
  font-family:'Bebas Neue',cursive;
  font-size:0.92rem;letter-spacing:3px;
  padding:0.5rem 1.4rem;
  background:rgba(0,255,136,0.07);
  border:1px solid rgba(0,255,136,0.35);
  color:var(--green);
  cursor:pointer;
  transition:all 0.2s;
  position:relative;
  overflow:hidden;
}
.check-btn::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,255,136,0.1),transparent);
  opacity:0;transition:opacity 0.2s;
}
.check-btn:hover::before{opacity:1;}
.check-btn:hover{
  background:rgba(0,255,136,0.12);
  border-color:var(--green);
  box-shadow:0 0 20px rgba(0,255,136,0.15),inset 0 0 20px rgba(0,255,136,0.05);
}
.check-btn:disabled{opacity:0.3;cursor:not-allowed;}
.check-btn.cooldown{
  border-color:rgba(0,255,136,0.12);
  color:var(--text3);
  cursor:not-allowed;
  background:rgba(0,255,136,0.02);
  letter-spacing:2px;
}
.check-btn.cooldown::before{opacity:0 !important;}
.check-btn.cooldown:hover{
  background:rgba(0,255,136,0.02) !important;
  border-color:rgba(0,255,136,0.12) !important;
  box-shadow:none !important;
}
/* Cooldown drain bar */
.check-btn::after{
  content:'';
  position:absolute;bottom:0;left:0;height:2px;
  background:var(--green);
  width:var(--cdw, 0%);
  transition:width 1s linear;
  box-shadow:0 0 6px rgba(0,255,136,0.5);
}
.check-btn.cooldown::after{
  background:rgba(0,255,136,0.35);
  box-shadow:none;
}

/* MAIN */
main{
  max-width:1160px;
  margin:0 auto;
  padding:1.75rem 2rem 3rem;
  position:relative;z-index:2;
}

/* STATS BAR */
.stats{
  display:flex;gap:0.6rem;margin-bottom:1.5rem;flex-wrap:wrap;
}
.stat{
  display:flex;align-items:center;gap:0.6rem;
  background:var(--card);
  border:1px solid var(--border);
  padding:0.5rem 1rem;
  position:relative;
  overflow:hidden;
}
.stat::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,255,136,0.2),transparent);
}
.stat-l{
  font-family:'JetBrains Mono',monospace;
  font-size:0.65rem;letter-spacing:2px;
  color:var(--text3);text-transform:uppercase;
}
.stat-v{
  font-family:'Bebas Neue',cursive;
  font-size:1rem;letter-spacing:2px;
  color:var(--green);
  text-shadow:0 0 12px rgba(0,255,136,0.4);
}

/* FILTER BAR */
.filter-wrap{
  display:flex;align-items:center;gap:0.75rem;margin-bottom:1.25rem;flex-wrap:wrap;
}
.filter-label{
  font-family:'JetBrains Mono',monospace;
  font-size:0.62rem;letter-spacing:3px;
  color:var(--text3);text-transform:uppercase;
  margin-right:0.25rem;
}
.fb{
  font-family:'JetBrains Mono',monospace;
  font-size:0.68rem;letter-spacing:2px;
  padding:0.3rem 0.85rem;
  background:transparent;
  border:1px solid var(--border);
  color:var(--text3);
  cursor:pointer;
  transition:all 0.18s;
  text-transform:uppercase;
}
.fb.active,.fb:hover{
  border-color:var(--green);
  color:var(--green);
  background:var(--green-dim);
  box-shadow:0 0 12px rgba(0,255,136,0.08);
}
.fb.active{
  text-shadow:0 0 10px rgba(0,255,136,0.4);
}

/* SCANNING STATUS */
.scanning{
  display:none;align-items:center;gap:0.85rem;
  background:rgba(0,255,136,0.03);
  border:1px solid rgba(0,255,136,0.18);
  padding:0.85rem 1.25rem;
  margin-bottom:1.25rem;
  position:relative;overflow:hidden;
}
.scanning::before{
  content:'';
  position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:pulse-bar 1s ease-in-out infinite;
}
@keyframes pulse-bar{0%,100%{opacity:1}50%{opacity:0.3}}
.scanning.show{display:flex;}
.spin{
  width:16px;height:16px;
  border:2px solid rgba(0,255,136,0.12);
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin 0.7s linear infinite;
  flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-txt{
  font-family:'JetBrains Mono',monospace;
  font-size:0.72rem;letter-spacing:1px;
  color:var(--green);
}
.scan-dots::after{
  content:'';
  animation:dots 1.5s infinite;
}
@keyframes dots{
  0%{content:'.'}
  33%{content:'..'}
  66%{content:'...'}
  100%{content:''}
}

.err{
  display:none;
  background:rgba(255,59,59,0.04);
  border:1px solid rgba(255,59,59,0.18);
  border-left:2px solid var(--red);
  padding:0.75rem 1.25rem;
  margin-bottom:1.25rem;
  font-family:'JetBrains Mono',monospace;
  font-size:0.73rem;
  color:var(--red);
  letter-spacing:0.5px;
}
.err.show{display:block;}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
  background:var(--border);
}
@media(max-width:920px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:580px){.grid{grid-template-columns:1fr;}}

/* CARD */
.card{
  background:var(--card);
  display:flex;flex-direction:column;
  overflow:hidden;
  text-decoration:none;
  position:relative;
  transition:background 0.22s,transform 0.22s;
  animation:slideIn 0.35s ease forwards;
}

.card:hover{
  background:var(--card-hover);
  transform:translateY(-2px);
  z-index:5;
  box-shadow:0 8px 40px rgba(0,0,0,0.6),0 0 0 1px var(--border2);
}

@keyframes slideIn{
  from{opacity:0;transform:translateY(-10px)}
  to{opacity:1;transform:translateY(0)}
}

/* Left accent bar */
.card::before{
  content:'';
  position:absolute;left:0;top:0;bottom:0;width:2px;
  z-index:2;
}
.card.r5::before{background:var(--green);box-shadow:0 0 12px var(--green);}
.card.r4::before{background:var(--cyan);box-shadow:0 0 8px var(--cyan);}
.card.r3::before{background:var(--orange);box-shadow:0 0 6px var(--orange);}
.card.r2::before{background:var(--red);}
.card.r1::before{background:var(--text3);}

/* Top shimmer on r5 */
.card.r5::after{
  content:'';
  position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,255,136,0.25),transparent);
}

/* IMAGE */
.card-img{
  width:100%;height:175px;
  overflow:hidden;flex-shrink:0;
  background:var(--bg2);
  position:relative;
}
.card-img img{
  width:100%;height:100%;
  object-fit:cover;
  transition:transform 0.4s ease,filter 0.4s ease;
  display:block;
  filter:brightness(0.88) saturate(0.9);
}
.card:hover .card-img img{
  transform:scale(1.05);
  filter:brightness(1) saturate(1.1);
}
.no-img{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-size:2.2rem;opacity:0.15;
  font-family:'JetBrains Mono',monospace;
  letter-spacing:2px;color:var(--green);
}

/* Rating overlay on image */
.img-rating{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(2,0,10,0.9));
  padding:1.5rem 0.75rem 0.6rem;
  display:flex;align-items:center;justify-content:flex-end;
}

/* BODY */
.card-body{
  padding:0.85rem 1rem 0.85rem 1.2rem;
  display:flex;flex-direction:column;gap:0.45rem;
  flex:1;
}

.card-meta{
  display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;
}

.badge{
  font-family:'Bebas Neue',cursive;
  font-size:0.78rem;letter-spacing:2px;
  padding:0.12rem 0.55rem;
}
.r5 .badge{background:rgba(0,255,136,0.1);color:var(--green);border:1px solid rgba(0,255,136,0.22);}
.r4 .badge{background:rgba(0,229,255,0.07);color:var(--cyan);border:1px solid rgba(0,229,255,0.18);}
.r3 .badge{background:rgba(255,140,0,0.07);color:var(--orange);border:1px solid rgba(255,140,0,0.2);}
.r2 .badge{background:rgba(255,59,59,0.07);color:var(--red);border:1px solid rgba(255,59,59,0.18);}
.r1 .badge{background:rgba(74,90,104,0.08);color:var(--text3);border:1px solid rgba(74,90,104,0.2);}

.src{
  font-family:'JetBrains Mono',monospace;
  font-size:0.6rem;letter-spacing:2px;
  color:var(--text3);text-transform:uppercase;
}
.win{
  font-family:'JetBrains Mono',monospace;
  font-size:0.58rem;letter-spacing:2px;
  text-transform:uppercase;
  padding:0.1rem 0.45rem;
  border:1px solid;
}
.win-now{color:var(--red);border-color:rgba(255,59,59,0.3);background:rgba(255,59,59,0.05);animation:flash 1.2s ease-in-out infinite;}
.win-good{color:var(--yellow);border-color:rgba(255,230,109,0.25);background:rgba(255,230,109,0.04);}
.win-ok{color:var(--text3);border-color:rgba(74,90,104,0.2);}
@keyframes flash{0%,100%{opacity:1}50%{opacity:0.4}}

.card-title{
  font-size:0.88rem;
  font-weight:700;
  color:var(--text);
  line-height:1.45;
  letter-spacing:0.1px;
}

.card-desc{
  font-family:'JetBrains Mono',monospace;
  font-size:0.72rem;
  color:var(--text2);
  line-height:1.55;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.card-bottom{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:auto;padding-top:0.4rem;
  flex-wrap:wrap;gap:0.4rem;
}

.coin{
  display:flex;align-items:center;gap:0.4rem;
  background:rgba(0,255,136,0.04);
  border:1px solid rgba(0,255,136,0.14);
  padding:0.18rem 0.6rem;
}
.coin-l{
  font-family:'JetBrains Mono',monospace;
  font-size:0.55rem;letter-spacing:3px;
  color:var(--text3);text-transform:uppercase;
}
.coin-v{
  font-family:'Bebas Neue',cursive;
  font-size:0.95rem;letter-spacing:2px;
  color:var(--green);
  text-shadow:0 0 10px rgba(0,255,136,0.4);
}

.time{
  font-family:'JetBrains Mono',monospace;
  font-size:0.6rem;color:var(--text3);
  letter-spacing:1px;
}

.read{
  font-family:'JetBrains Mono',monospace;
  font-size:0.65rem;letter-spacing:2px;
  color:var(--cyan);text-transform:uppercase;
  opacity:0;transition:opacity 0.2s;
}
.card:hover .read{opacity:1;}

.reason{
  font-family:'JetBrains Mono',monospace;
  font-size:0.67rem;
  color:var(--text3);
  border-top:1px solid rgba(0,255,136,0.07);
  padding-top:0.5rem;margin-top:0.2rem;
  line-height:1.6;
  letter-spacing:0.3px;
}
.reason-icon{color:var(--green);margin-right:0.3rem;}

/* EMPTY */
.empty{
  text-align:center;
  padding:5rem 2rem;
  color:var(--text3);
  grid-column:1/-1;
  background:var(--card);
}
.empty-radar{
  width:80px;height:80px;
  margin:0 auto 1.5rem;
  position:relative;
}
.empty-radar svg{width:100%;height:100%;animation:radar-rotate 3s linear infinite;}
@keyframes radar-rotate{to{transform:rotate(360deg)}}
.empty-title{
  font-family:'Bebas Neue',cursive;
  font-size:1.6rem;letter-spacing:4px;
  margin-bottom:0.5rem;
  color:var(--text2);
}
.empty-sub{
  font-family:'JetBrains Mono',monospace;
  font-size:0.68rem;letter-spacing:3px;
  color:var(--text3);
}

/* BOTTOM BTNS */
.btns{
  display:flex;gap:0.75rem;
  margin-top:1.5rem;
}
.btn{
  flex:1;
  font-family:'Bebas Neue',cursive;
  font-size:1rem;letter-spacing:4px;
  padding:0.95rem;
  border:1px solid;
  cursor:pointer;
  background:transparent;
  transition:all 0.2s;
  position:relative;overflow:hidden;
}
.btn-scan{
  border-color:rgba(0,255,136,0.28);
  color:var(--green);
}
.btn-scan::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,255,136,0.08),transparent);
  opacity:0;transition:opacity 0.2s;
}
.btn-scan:hover::before{opacity:1;}
.btn-scan:hover{
  border-color:var(--green);
  box-shadow:0 0 25px rgba(0,255,136,0.1);
}
.btn-scan:disabled{opacity:0.3;cursor:not-allowed;}
.btn-clear{
  max-width:200px;
  border-color:rgba(255,59,59,0.18);
  color:rgba(255,59,59,0.6);
}
.btn-clear:hover{
  border-color:rgba(255,59,59,0.4);
  color:var(--red);
  background:rgba(255,59,59,0.04);
}

@media(max-width:580px){
  header{padding:0 1rem;height:56px;}
  .logo-text{font-size:1.35rem;letter-spacing:4px;}
  main{padding:1.25rem 1rem 2rem;}
  .btns{flex-direction:column;}
  .btn-clear{max-width:100%;}
}
</style>
</head>
<body>

<div class="scanlines"></div>

<header>
  <a class="logo" href="#">
    <svg width="38" height="38" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="10" fill="#02000a"/>
      <circle cx="32" cy="32" r="26" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.35"/>
      <circle cx="32" cy="32" r="17" fill="none" stroke="#00ff88" stroke-width="0.8" opacity="0.22"/>
      <circle cx="32" cy="32" r="8" fill="none" stroke="#00ff88" stroke-width="0.6" opacity="0.15"/>
      <line x1="6" y1="32" x2="58" y2="32" stroke="#00ff88" stroke-width="0.5" opacity="0.15"/>
      <line x1="32" y1="6" x2="32" y2="58" stroke="#00ff88" stroke-width="0.5" opacity="0.15"/>
      <line x1="32" y1="32" x2="50" y2="16" stroke="#00ff88" stroke-width="2" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="3" fill="#00ff88"/>
      <circle cx="50" cy="16" r="3.5" fill="#00ff88"/>
      <circle cx="50" cy="16" r="7" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.5">
        <animate attributeName="r" values="3.5;10;3.5" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite"/>
      </circle>
    </svg>
    <div>
      <div class="logo-text">PUMP RADAR</div>
      <div class="logo-sub">AI News Scanner</div>
    </div>
  </a>

  <div class="header-right">
    <div class="live-pill">
      <div class="live-dot" id="liveDot"></div>
      <div class="live-txt" id="liveTxt">LIVE</div>
    </div>
    <button class="check-btn" id="checkBtnH" onclick="scan()">⚡ CHECK NOW</button>
  </div>
</header>

<main>

  <div class="stats">
    <div class="stat">
      <span class="stat-l">Scans</span>
      <span class="stat-v" id="sChecked">0</span>
    </div>
    <div class="stat">
      <span class="stat-l">Found</span>
      <span class="stat-v" id="sFound">0</span>
    </div>
    <div class="stat">
      <span class="stat-l">🔥🔥🔥🔥🔥</span>
      <span class="stat-v" id="sFive">0</span>
    </div>
    <div class="stat">
      <span class="stat-l">Last scan</span>
      <span class="stat-v" id="sLast">—</span>
    </div>
  </div>

  <div class="filter-wrap">
    <span class="filter-label">Filter</span>
    <button class="fb active" onclick="filter('all',this)">ALL</button>
    <button class="fb" onclick="filter('5',this)">🔥🔥🔥🔥🔥 &nbsp;5/5</button>
    <button class="fb" onclick="filter('4',this)">🔥🔥🔥🔥 &nbsp;4/5</button>
    <button class="fb" onclick="filter('3',this)">🔥🔥🔥 &nbsp;3/5</button>
    <button class="fb" onclick="filter('2',this)">🔥🔥 &nbsp;2/5</button>
    <button class="fb" onclick="filter('1',this)">🔥 &nbsp;1/5</button>
  </div>

  <div class="scanning" id="scanning">
    <div class="spin"></div>
    <span class="scan-txt">Scanning news and rating meme potential<span class="scan-dots"></span></span>
  </div>
  <div class="err" id="err"></div>

  <div class="grid" id="grid">
    <div class="empty">
      <div class="empty-radar">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="28" stroke="rgba(0,255,136,0.2)" stroke-width="1"/>
          <circle cx="32" cy="32" r="18" stroke="rgba(0,255,136,0.15)" stroke-width="0.8"/>
          <circle cx="32" cy="32" r="9" stroke="rgba(0,255,136,0.12)" stroke-width="0.6"/>
          <line x1="4" y1="32" x2="60" y2="32" stroke="rgba(0,255,136,0.1)" stroke-width="0.5"/>
          <line x1="32" y1="4" x2="32" y2="60" stroke="rgba(0,255,136,0.1)" stroke-width="0.5"/>
          <line x1="32" y1="32" x2="52" y2="14" stroke="#00ff88" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="32" cy="32" r="2.5" fill="#00ff88"/>
        </svg>
      </div>
      <div class="empty-title">RADAR READY</div>
      <div class="empty-sub">Press CHECK NOW to scan for signals</div>
    </div>
  </div>

  <div class="btns">
    <button class="btn btn-scan" id="checkBtn" onclick="scan()">⚡ &nbsp;CHECK NEWS NOW</button>
    <button class="btn btn-clear" onclick="clearAll()">CLEAR ALL</button>
  </div>

</main>

<script>
let news = [];
let checked = 0, found = 0, fives = 0;
let currentFilter = 'all';
let scanning = false;
let lastCheck = 0;
const COOLDOWN = 5 * 60 * 1000;
let cooldownInterval = null;

function timeAgo(d) {
  if (!d) return '';
  const diff = Date.now() - new Date(d).getTime();
  const m = Math.floor(diff/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m+'m ago';
  const h = Math.floor(m/60);
  if (h < 24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}

async function scan() {
  if (scanning) return;
  scanning = true;

  const btn = document.getElementById('checkBtn');
  const btnH = document.getElementById('checkBtnH');
  btn.disabled = true; btn.textContent = '⏳ Scanning...';
  if (btnH) { btnH.disabled = true; btnH.textContent = '⏳'; }
  document.getElementById('scanning').classList.add('show');
  document.getElementById('err').classList.remove('show');
  document.getElementById('liveTxt').textContent = 'SCANNING';
  document.getElementById('liveDot').style.background = '#ffe66d';
  document.getElementById('liveDot').style.boxShadow = '0 0 8px #ffe66d';

  const now = new Date();
  const timeStr = now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});

  try {
    const res = await fetch('/api/news');
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'API error');

    checked++;
    document.getElementById('sChecked').textContent = checked;
    document.getElementById('sLast').textContent = timeStr;

    if (data.articles && data.articles.length > 0) {
      const existingUrls = new Set(news.map(n => n.url));
      const fresh = data.articles.filter(n => !existingUrls.has(n.url));
      fresh.forEach(n => {
        n.checkedAt = timeStr;
        found++;
        if (n.rating === 5) fives++;
      });
      if (fresh.length > 0) news = [...fresh, ...news].slice(0, 500);
      document.getElementById('sFound').textContent = found;
      document.getElementById('sFive').textContent = fives;
    }

    render();
    save(timeStr);
  } catch(e) {
    const el = document.getElementById('err');
    el.textContent = '⚠ ' + e.message;
    el.classList.add('show');
  }

  scanning = false;
  document.getElementById('scanning').classList.remove('show');
  document.getElementById('liveTxt').textContent = 'LIVE';
  document.getElementById('liveDot').style.background = 'var(--green)';
  document.getElementById('liveDot').style.boxShadow = '0 0 8px var(--green)';
  btn.disabled = false; btn.textContent = '⚡  CHECK NEWS NOW';
  lastCheck = Date.now();
  localStorage.setItem('pr_last', lastCheck);
  startCooldownH();
}

function startCooldownH() {
  const btnH = document.getElementById('checkBtnH');
  if (!btnH) return;
  if (cooldownInterval) clearInterval(cooldownInterval);

  btnH.disabled = true;
  btnH.classList.add('cooldown');

  function tick() {
    const elapsed = Date.now() - lastCheck;
    const remaining = COOLDOWN - elapsed;
    if (remaining <= 0) {
      clearInterval(cooldownInterval);
      cooldownInterval = null;
      btnH.disabled = false;
      btnH.classList.remove('cooldown');
      btnH.textContent = '⚡ CHECK NOW';
      btnH.style.setProperty('--cdw', '0%');
      return;
    }
    const pct = Math.round((remaining / COOLDOWN) * 100);
    btnH.style.setProperty('--cdw', pct + '%');
    const secs = Math.ceil(remaining / 1000);
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    btnH.textContent = m + ':' + String(s).padStart(2,'0');
  }

  tick();
  cooldownInterval = setInterval(tick, 1000);
}

function render() {
  const grid = document.getElementById('grid');
  const filtered = currentFilter === 'all' ? news : news.filter(n => String(n.rating) === currentFilter);
  const sorted = [...filtered].sort((a,b) => b.rating - a.rating);

  if (sorted.length === 0) {
    grid.innerHTML = `<div class="empty">
      <div class="empty-radar"><svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="28" stroke="rgba(0,255,136,0.2)" stroke-width="1"/><circle cx="32" cy="32" r="18" stroke="rgba(0,255,136,0.15)" stroke-width="0.8"/><circle cx="32" cy="32" r="9" stroke="rgba(0,255,136,0.12)" stroke-width="0.6"/><line x1="4" y1="32" x2="60" y2="32" stroke="rgba(0,255,136,0.1)" stroke-width="0.5"/><line x1="32" y1="4" x2="32" y2="60" stroke="rgba(0,255,136,0.1)" stroke-width="0.5"/><line x1="32" y1="32" x2="52" y2="14" stroke="#00ff88" stroke-width="1.5" stroke-linecap="round"/><circle cx="32" cy="32" r="2.5" fill="#00ff88"/></svg></div>
      <div class="empty-title">${currentFilter==='all'?'No signals yet':'Nothing found'}</div>
      <div class="empty-sub">${currentFilter==='all'?'Press CHECK NOW to scan':'Try another filter'}</div>
    </div>`;
    return;
  }

  const stars = r => '🔥'.repeat(r);
  const win = w => {
    if (w==='now') return '<span class="win win-now">⚡ LAUNCH NOW</span>';
    if (w==='good') return '<span class="win win-good">⏰ WITHIN 2H</span>';
    return '<span class="win win-ok">📅 TODAY</span>';
  };

  grid.innerHTML = sorted.map(n => `
    <a class="card r${n.rating}" href="${n.url||'#'}" target="_blank" rel="noopener">
      <div class="card-img">
        ${n.image
          ? `<img src="${n.image}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\"no-img\\">[NO IMG]</div>'">`
          : '<div class="no-img">[NO IMG]</div>'}
        <div class="img-rating">
          ${win(n.window)}
        </div>
      </div>
      <div class="card-body">
        <div class="card-meta">
          <span class="badge">${stars(n.rating)} ${n.rating}/5</span>
          ${n.source?`<span class="src">${n.source}</span>`:''}
          <span class="time">${timeAgo(n.publishedAt)}</span>
        </div>
        <div class="card-title">${n.title}</div>
        ${n.description?`<div class="card-desc">${n.description}</div>`:''}
        <div class="card-bottom">
          <div class="coin">
            <span class="coin-l">Coin</span>
            <span class="coin-v">${n.coin||'$COIN'}</span>
          </div>
          <span class="read">Read →</span>
        </div>
        ${n.reason&&n.reason!=='Auto-rated'?`<div class="reason"><span class="reason-icon">◈</span>${n.reason}</div>`:''}
      </div>
    </a>`).join('');
}

function filter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.fb').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function clearAll() {
  if (!confirm('Clear all news?')) return;
  news = []; checked = 0; found = 0; fives = 0;
  ['sChecked','sFound','sFive'].forEach(id => document.getElementById(id).textContent = '0');
  document.getElementById('sLast').textContent = '—';
  localStorage.clear();
  render();
}

function save(t) {
  localStorage.setItem('pr_news', JSON.stringify(news));
  localStorage.setItem('pr_stats', JSON.stringify({checked, found, fives, last: t}));
}

window.addEventListener('load', () => {
  try {
    const n = localStorage.getItem('pr_news');
    if (n) { news = JSON.parse(n); render(); }
    const s = localStorage.getItem('pr_stats');
    if (s) {
      const p = JSON.parse(s);
      checked=p.checked||0; found=p.found||0; fives=p.fives||0;
      document.getElementById('sChecked').textContent = checked;
      document.getElementById('sFound').textContent = found;
      document.getElementById('sFive').textContent = fives;
      if (p.last) document.getElementById('sLast').textContent = p.last;
    }
    const lc = localStorage.getItem('pr_last');
    if (lc) {
      lastCheck = parseInt(lc);
      if (Date.now() - lastCheck < COOLDOWN) startCooldownH();
    }
  } catch(e){}
});
</script>
</body>
</html>
